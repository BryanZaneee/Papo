<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAPO — Electronic Press Kit</title>
    <link rel="icon" type="image/png" href="Assets/orange1.png?v=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Archivo:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="src/styles.css?v=47">
    <!-- Preload the fixed backdrop while the game runs (photos are picked from site.json by runner-game.js) -->
    <link rel="preload" as="image" href="Assets/flavor/treebackground.webp">
</head>

<body class="game-active">

    <!-- ═══ RUNNER GAME OVERLAY ═══ -->
    <div id="gameOverlay" class="game-overlay">
        <canvas id="gameCanvas"></canvas>
        <div id="gameFinishActions" class="game-finish-actions">
            <button id="gameEnter" class="game-btn game-btn-primary">ENTER EPK →</button>
            <button id="gameKeepRunning" class="game-btn">KEEP RUNNING</button>
        </div>
        <button id="gameSkip" class="game-skip">SKIP →</button>
    </div>

    <!-- ═══ FIXED BACKDROP LAYERS ═══ -->
    <div class="tree-bg" id="treeBg"></div>
    <div class="tree-veil"></div>
    <div class="tree-glow tree-glow-blue" id="glowBlue"></div>
    <div class="tree-glow tree-glow-orange" id="glowOrange"></div>
    <div class="grain"></div>

    <!-- ═══ NAV ═══ -->
    <nav class="site-nav">
        <a href="#" class="nav-wordmark">AYOPAPO</a>
        <div class="nav-links">
            <a href="#bio">Bio</a>
            <a href="#releases">Releases</a>
            <a href="#archives">Archives</a>
            <a href="#sets">Sets</a>
            <a href="#gallery">Gallery</a>
            <a href="#book" class="nav-book">Book Papo</a>
        </div>
    </nav>

    <!-- ═══ HERO ═══ -->
    <section class="hero">
        <video class="hero-video" autoplay muted loop playsinline preload="auto"
            poster="/Assets/Videos/hero-bg-poster.jpg">
            <source src="/Assets/Videos/hero-bg.mp4" type="video/mp4">
        </video>
        <div class="hero-video-veil"></div>
        <div class="hero-left">
            <div class="hero-content-group">
                <h1 class="hero-name reveal reveal-delay-1">
                    <span class="glitch-text"></span>
                    <span class="hero-cutout" aria-hidden="true">
                        <img src="Assets/flavor/papo2.webp" alt="">
                    </span>
                </h1>

                <p class="hero-subtitle reveal reveal-delay-2"></p>

                <div class="hero-meta reveal reveal-delay-3">
                    <span><span class="dot"></span></span>
                </div>

                <div class="hero-links reveal reveal-delay-4"></div>
            </div>
        </div>

    </section>

    <!-- ═══ MAIN COLUMN (bio → gallery) ═══ -->
    <div class="trunk">

        <!-- ═══ BIO ═══ -->
        <section id="bio" class="epk-section">
            <div class="bio-grid">
                <div class="bio-image reveal">
                    <div class="bio-image-frame"></div>
                    <div class="bio-image-caption"></div>
                </div>
                <div class="bio-copy">
                    <h2 class="section-heading reveal reveal-delay-1"></h2>
                    <div class="bio-text reveal reveal-delay-2"></div>
                </div>
            </div>
        </section>

        <!-- ═══ RELEASES ═══ -->
        <section id="releases" class="epk-section">
            <div class="eyebrow reveal">Releases</div>
            <div class="releases-grid">
                <div class="release-cover-col reveal reveal-delay-1">
                    <div class="release-cover"></div>
                    <div class="release-tags"></div>
                </div>
                <div class="release-info">
                    <h2 class="release-title reveal"></h2>
                    <p class="release-blurb reveal reveal-delay-1"></p>

                    <div class="track-list"></div>
                    <div class="track-indicia"></div>
                </div>
            </div>
        </section>

    </div>

    <!-- ═══ DJ EVENT ARCHIVES — full-bleed poster wall ═══ -->
    <section id="archives" class="archives-section">
        <div class="archives-head">
            <h2 class="section-heading reveal reveal-delay-1"></h2>
        </div>
        <div class="poster-strip"></div>

        <!-- ═══ SETS — live DJ set videos ═══ -->
        <div id="sets" class="sets-grid"></div>
    </section>

    <div class="trunk">

        <!-- ═══ GALLERY ═══ -->
        <section id="gallery" class="epk-section">
            <h2 class="section-heading reveal reveal-delay-1">Gallery</h2>
            <div class="gallery-masonry"></div>
        </section>

    </div>

    <!-- ═══ BOOKING FOOTER ═══ -->
    <footer id="book" class="booking-section">
        <div class="eyebrow reveal"></div>
        <h2 class="booking-heading reveal reveal-delay-1"></h2>
        <p class="booking-sub reveal reveal-delay-2"></p>
        <div class="booking-cards"></div>
        <div class="social-pills"></div>
        <div class="footer-line">
            <span></span>
            <span>Made with love by <a href="https://bryanzane.com" target="_blank" rel="noopener">Bryan Zane</a></span>
        </div>
    </footer>

    <!-- ═══ NOW PLAYING BAR ═══ -->
    <div class="now-playing" id="nowPlaying">
        <button class="np-toggle" id="npToggle" aria-label="Play / pause"></button>
        <div class="np-info">
            <div class="np-label"></div>
            <div class="np-title" id="npTitle"></div>
        </div>
        <div class="np-progress">
            <span class="np-time" id="npTime">0:00</span>
            <div class="np-seek" id="npSeek"><div class="np-fill" id="npFill"></div></div>
            <span class="np-time" id="npDur">—:—</span>
        </div>
    </div>
    <audio id="sharedAudio" preload="metadata"></audio>

    <!-- ═══ LIGHTBOX ═══ -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close">ESC</button>
        <img src="" alt="Gallery fullscreen">
    </div>

    <!-- ═══ SCRIPTS ═══ -->
    <script src="src/runner-game.js?v=20"></script>
    <script src="src/content.js?v=3" defer></script>
    <script src="src/scroll-reveal.js?v=8" defer></script>
    <script src="src/audio-player.js?v=7" defer></script>
    <script src="src/lightbox.js?v=6" defer></script>
    <script>
        // Tree parallax + glow cross-fade: scroll progress drives the tree's
        // background-position-y and fades the bottom glow from blue to orange
        (function () {
            var tree = document.getElementById('treeBg');
            var glowBlue = document.getElementById('glowBlue');
            var glowOrange = document.getElementById('glowOrange');
            var last = -1;
            function update() {
                var doc = document.documentElement;
                var max = (doc.scrollHeight - window.innerHeight) || 1;
                var p = Math.min(1, Math.max(0, (window.scrollY || 0) / max));
                if (p !== last) {
                    last = p;
                    tree.style.backgroundPositionY = (p * 100) + '%';
                    glowBlue.style.opacity = 1 - p;
                    glowOrange.style.opacity = p;
                }
            }
            window.addEventListener('scroll', update, { passive: true });
            window.addEventListener('resize', update);
            update();
        })();
    </script>

</body>

</html>
