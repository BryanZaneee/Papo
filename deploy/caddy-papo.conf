# Site block for /etc/caddy/Caddyfile on the VPS (replaces the old ayopapo.studio block).
#
# TLS is the Cloudflare origin cert (the zone is proxied, SSL mode Full).
# Headers are spelled out instead of `import sechdrs` because the admin embeds
# the site in a same-origin <iframe> for the live preview: X-Frame-Options must
# be SAMEORIGIN and frame-ancestors 'self', not DENY / 'none'. script-src keeps
# 'unsafe-inline' for the parallax IIFE in index.html.

ayopapo.studio, www.ayopapo.studio {
	tls /etc/caddy/certs/ayopapo-origin.crt /etc/caddy/certs/ayopapo-origin.key
	import perf

	root * /var/www/papo-static

	header {
		Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
		X-Content-Type-Options "nosniff"
		X-Frame-Options "SAMEORIGIN"
		Referrer-Policy "strict-origin-when-cross-origin"
		Permissions-Policy "camera=(), microphone=(), geolocation=()"
		Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; frame-src 'self' https://www.youtube-nocookie.com; frame-ancestors 'self';"
		-Server
	}

	@blocked {
		path /.git/* /.claude/* /package.json /package-lock.json /CLAUDE.md /node_modules/*
	}
	respond @blocked 404

	# Admin API — Express on loopback (systemd: papo-api)
	handle /api/* {
		header Cache-Control "no-store"
		reverse_proxy 127.0.0.1:3006
	}

	# Client-edited content + uploads live outside the web root so a redeploy
	# never touches them. site.json must never be cached (edge included);
	# uploads have unique names so they can be cached forever.
	handle /content/* {
		root * /var/www/papo
		respond /content/.backups/* 404
		@json path *.json
		header @json Cache-Control "no-cache"
		header @json CDN-Cache-Control "no-store"
		header /content/uploads/* Cache-Control "public, max-age=31536000, immutable"
		file_server
	}

	# Vite fingerprints everything under /admin/assets — immutable. The HTML
	# shells must always revalidate or a deploy is masked by a cached index.html.
	@admin_assets path /admin/assets/*
	header @admin_assets Cache-Control "public, max-age=31536000, immutable"
	@html path / /index.html /admin /admin/ /admin/index.html
	header @html Cache-Control "no-cache, must-revalidate"
	header @html CDN-Cache-Control "no-store"

	@static_assets {
		path *.jpg *.jpeg *.png *.gif *.webp *.svg *.wav *.mp3 *.m4a *.mp4
	}
	header @static_assets Cache-Control "public, max-age=31536000, immutable"

	@code_assets {
		path *.css *.js
	}
	header @code_assets Cache-Control "public, max-age=604800"

	# Public site + /admin/ (dist/admin/index.html). The admin is unlinked
	# and noindex — reachable only by typing the URL.
	file_server

	import logfile ayopapo.studio
}
